<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ARU Marketplace</title>

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="/src/style.css"
    >
</head>

<body>

    <!-- ========================================
         HEADER
    ========================================= -->

    <header class="marketplace-header">

        <div class="header-content">

            <div class="brand">
                <i class="bi bi-shop"></i>

                <h1>ARU Marketplace</h1>
            </div>

            <button
                id="logout-button"
                type="button"
                class="logout-button"
            >
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </button>

        </div>

    </header>


    <!-- ========================================
         MAIN CONTENT
    ========================================= -->

    <main class="marketplace-container">


        <!-- ====================================
             WELCOME
        ==================================== -->

        <section class="welcome-section">

            <p class="welcome-label">
                Welcome back
            </p>

            <h2 id="welcome-message">
                Welcome to ARU Marketplace
            </h2>

            <p class="welcome-description">
                Buy and sell products within the ARU community.
            </p>

        </section>


        <!-- ====================================
             SEARCH
        ==================================== -->

        <section class="search-section">

            <div class="search-box">

                <i class="bi bi-search"></i>

                <input
                    type="search"
                    id="search-input"
                    placeholder="Search products..."
                    aria-label="Search products"
                >

            </div>

        </section>


        <!-- ====================================
             CATEGORIES
        ==================================== -->

        <section class="categories-section">

            <div class="section-heading">

                <div>
                    <p class="section-label">
                        Explore
                    </p>

                    <h2>
                        Categories
                    </h2>
                </div>

            </div>


            <div class="categories-grid">


                <button
                    class="category-card"
                    data-category="electronics"
                >
                    <i class="bi bi-laptop"></i>
                    <span>Electronics</span>
                </button>


                <button
                    class="category-card"
                    data-category="phones_accessories"
                >
                    <i class="bi bi-phone"></i>
                    <span>Phones & Accessories</span>
                </button>


                <button
                    class="category-card"
                    data-category="books_notes"
                >
                    <i class="bi bi-book"></i>
                    <span>Books & Notes</span>
                </button>


                <button
                    class="category-card"
                    data-category="fashion"
                >
                    <i class="bi bi-bag"></i>
                    <span>Fashion</span>
                </button>


                <button
                    class="category-card"
                    data-category="hostel_items"
                >
                    <i class="bi bi-house"></i>
                    <span>Hostel Items</span>
                </button>


                <button
                    class="category-card"
                    data-category="services"
                >
                    <i class="bi bi-tools"></i>
                    <span>Services</span>
                </button>


                <button
                    class="category-card"
                    data-category="other"
                >
                    <i class="bi bi-grid"></i>
                    <span>Other</span>
                </button>

            </div>

        </section>


        <!-- ====================================
             PRODUCTS
        ==================================== -->

        <section class="products-section">

            <div class="section-heading">

                <div>
                    <p class="section-label">
                        Marketplace
                    </p>

                    <h2>
                        Latest Products
                    </h2>
                </div>

                <button
                    type="button"
                    class="view-all-button"
                >
                    View All
                    <i class="bi bi-arrow-right"></i>
                </button>

            </div>


            <div
                id="products-container"
                class="products-grid"
            >

                <p class="empty-products">
                    Products will appear here.
                </p>

            </div>

        </section>

    </main>


    <!-- ========================================
         BOTTOM NAVIGATION
    ========================================= -->

    <nav class="bottom-navigation">


        <a
            href="/home.html"
            class="nav-item active"
        >
            <i class="bi bi-house-fill"></i>
            <span>Home</span>
        </a>


        <a
            href="#"
            class="nav-item"
            id="orders-link"
        >
            <i class="bi bi-box-seam"></i>
            <span>Orders</span>
        </a>


        <a
            href="#"
            class="nav-item"
            id="sell-link"
        >
            <i class="bi bi-plus-circle-fill"></i>
            <span>Sell</span>
        </a>


        <a
            href="#"
            class="nav-item"
            id="profile-link"
        >
            <i class="bi bi-person-circle"></i>
            <span>Profile</span>
        </a>


    </nav>


    <!-- ========================================
         JAVASCRIPT
    ========================================= -->

    <script
        type="module"
        src="/src/home.js"
    ></script>

</body>

</html>
