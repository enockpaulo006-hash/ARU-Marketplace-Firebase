<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Product Details - ARU Marketplace</title>

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="/src/style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="marketplace-header">

        <div class="header-left">

            <a
                href="/home.html"
                class="back-button"
                aria-label="Back to marketplace"
            >
                <i class="bi bi-arrow-left"></i>
            </a>

            <div class="brand">

                <i class="bi bi-shop"></i>

                <span>ARU Marketplace</span>

            </div>

        </div>

    </header>


    <!-- PRODUCT DETAILS -->
    <main class="product-details-page">

        <div id="product-loading" class="product-loading">

            <i class="bi bi-arrow-repeat"></i>

            <p>Loading product...</p>

        </div>


        <div
            id="product-error"
            class="product-error"
            style="display: none;"
        >

            <i class="bi bi-exclamation-circle"></i>

            <h2>Product not found</h2>

            <p>
                This product may have been removed
                or is no longer available.
            </p>

            <a href="/home.html">
                Back to Marketplace
            </a>

        </div>


        <section
            id="product-content"
            class="product-content"
            style="display: none;"
        >

            <!-- PRODUCT IMAGES -->

            <div class="product-gallery">

                <div
                    id="product-main-image"
                    class="product-main-image"
                >
                </div>

                <div
                    id="product-image-thumbnails"
                    class="product-image-thumbnails"
                >
                </div>

            </div>


            <!-- PRODUCT INFORMATION -->

            <div class="product-information">

                <span
                    id="product-category"
                    class="product-detail-category"
                ></span>


                <h1 id="product-title"></h1>


                <p
                    id="product-price"
                    class="product-detail-price"
                ></p>


                <div class="product-detail-info">

                    <div class="detail-item">

                        <i class="bi bi-tag"></i>

                        <div>

                            <span>Condition</span>

                            <strong id="product-condition"></strong>

                        </div>

                    </div>


                    <div class="detail-item">

                        <i class="bi bi-geo-alt"></i>

                        <div>

                            <span>Location</span>

                            <strong id="product-location"></strong>

                        </div>

                    </div>

                </div>


                <div class="product-description-section">

                    <h2>Description</h2>

                    <p id="product-description"></p>

                </div>



                <div class="product-actions">

                    <div class="order-quantity-section">
                        <label for="order-quantity">Quantity</label>

                        <div class="quantity-control">
                            <button
                                type="button"
                                id="decrease-quantity"
                                aria-label="Decrease quantity">
                                −
                            </button>

                            <input
                                type="number"
                                id="order-quantity"
                                value="1"
                                min="1"
                                max="99"
                                step="1"
                                inputmode="numeric"
                            >

                            <button
                                type="button"
                                id="increase-quantity"
                                aria-label="Increase quantity">
                                +
                            </button>
                        </div>

                        <p class="order-total">
                            Total:
                            <strong id="order-total-price">TZS 0</strong>
                        </p>
                    </div>

                    <button
                        type="button"
                        id="place-order-button"
                        class="place-order-button">
                        <i class="bi bi-bag-check"></i>
                        Place Order
                    </button>

                    <button
                        type="button"
                        id="contact-seller-button"
                        class="contact-seller-button">
                        <i class="bi bi-chat-dots"></i>
                        Contact Seller
                    </button>

                    <p
                        id="order-message"
                        class="order-message"
                        role="status"
                        aria-live="polite">
                    </p>

                </div>


            </div>

        </section>

    </main>


    <!-- BOTTOM NAVIGATION -->

    <nav class="bottom-nav">

        <a href="/home.html">

            <i class="bi bi-house-fill"></i>

            <span>Home</span>

        </a>


        <a href="#">

            <i class="bi bi-box-seam"></i>

            <span>Orders</span>

        </a>


        <a href="/sell.html">

            <i class="bi bi-plus-circle-fill"></i>

            <span>Sell</span>

        </a>


        <a href="#">

            <i class="bi bi-person-circle"></i>

            <span>Profile</span>

        </a>

    </nav>


    <!-- PRODUCT JAVASCRIPT -->

    <script
        type="module"
        src="/src/product.js"
    ></script>

</body>
</html>
