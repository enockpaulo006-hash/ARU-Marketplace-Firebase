<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#065597">
    <meta name="description" content="Review and moderate ARU Marketplace product submissions.">

    <title>Product Review | ARU Marketplace</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >
</head>

<body>
    <header class="my-products-header">
        <a
            href="/home.html"
            class="back-link"
            aria-label="Back to marketplace"
        >
            <i class="bi bi-arrow-left"></i>
        </a>

        <div>
            <h1>Product Review</h1>
            <p>ARU Marketplace Moderator</p>
        </div>
    </header>

    <main class="my-products-main">
        <section
            class="my-products-summary"
            aria-labelledby="review-heading"
        >
            <h2 id="review-heading">Review Products</h2>

            <p>
                Review seller submissions and approve or reject each
                product individually.
            </p>

            <div
                id="moderator-count"
                class="product-count"
                aria-live="polite"
            >
                Loading products...
            </div>
        </section>

        <section class="moderator-search" aria-label="Search products">
            <label for="moderator-search-input">
                Search products or seller UID
            </label>

            <input
                id="moderator-search-input"
                type="search"
                placeholder="Search title, category, or seller UID"
                autocomplete="off"
            >
        </section>

        <nav
            class="moderator-filters"
            aria-label="Filter products by status"
        >
            <button
                type="button"
                class="product-filter active"
                data-status="pending"
                aria-pressed="true"
            >
                Pending
            </button>

            <button
                type="button"
                class="product-filter"
                data-status="active"
                aria-pressed="false"
            >
                Approved
            </button>

            <button
                type="button"
                class="product-filter"
                data-status="rejected"
                aria-pressed="false"
            >
                Rejected
            </button>

            <button
                type="button"
                class="product-filter"
                data-status="all"
                aria-pressed="false"
            >
                All
            </button>
        </nav>

        <section
            id="moderator-products-list"
            class="my-products-list"
            aria-label="Products for review"
            aria-live="polite"
            aria-busy="true"
        >
            <p class="my-products-message">Loading products...</p>
        </section>

        <div class="moderator-refresh">
            <button
                type="button"
                id="moderator-refresh-button"
                class="btn btn-outline-primary"
            >
                <i class="bi bi-arrow-clockwise"></i>
                Refresh products
            </button>
        </div>
    </main>

    <script type="module" src="/src/moderator.js"></script>
</body>
</html>
