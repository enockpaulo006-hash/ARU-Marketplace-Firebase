<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products | ARU Marketplace</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >
</head>
<body>
    <header class="my-products-header">
        <a href="/home.html" class="back-link" aria-label="Back to Home">
            <i class="bi bi-arrow-left"></i>
        </a>
        <div>
            <h1>My Products</h1>
            <p>Manage your marketplace listings</p>
        </div>
    </header>

    <main class="my-products-main">
        <section class="my-products-summary">
            <h2>Your listings</h2>
            <p>Track your submissions and review results.</p>
            <div id="product-count" class="product-count">
                Loading your products...
            </div>
        </section>

        <section class="my-products-filters" aria-label="Filter products">
            <button type="button" class="product-filter active"
                    data-status="all">All</button>
            <button type="button" class="product-filter"
                    data-status="pending">Pending</button>
            <button type="button" class="product-filter"
                    data-status="active">Approved</button>
            <button type="button" class="product-filter"
                    data-status="rejected">Rejected</button>
            <button type="button" class="product-filter"
                    data-status="hidden">Hidden</button>
            <button type="button" class="product-filter"
                    data-status="sold">Sold</button>
        </section>

        <section id="my-products-list" class="my-products-list">
            <p class="my-products-message">Loading your products...</p>
        </section>

        <a href="/sell.html" class="my-products-add-button">
            <i class="bi bi-plus-circle"></i>
            Add Another Product
        </a>
    </main>

    <nav class="bottom-nav">
        <a href="/home.html">
            <i class="bi bi-house-fill"></i>
            <span>Home</span>
        </a>
        <a href="orders.html" aria-label="Orders">
            <i class="bi bi-box-seam"></i>
            <span>Orders</span>
        </a>
        <a href="/sell.html">
            <i class="bi bi-plus-circle-fill"></i>
            <span>Sell</span>
        </a>
        <a href="/my-products.html" class="active">
            <i class="bi bi-person-circle"></i>
            <span>My Products</span>
        </a>
    </nav>

    <script type="module" src="/src/my-products.js"></script>
</body>
</html>
