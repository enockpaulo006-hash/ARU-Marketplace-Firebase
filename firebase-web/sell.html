<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sell - ARU Marketplace</title>

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="/src/style.css"
    >

</head>


<body>


    <!-- ========================================
         HEADER
    ========================================= -->

    <header class="marketplace-header">

        <div class="header-content">

            <a
                href="/home.html"
                class="back-button"
                aria-label="Back to home"
            >
                <i class="bi bi-arrow-left"></i>
            </a>

            <div class="brand">

                <i class="bi bi-shop"></i>

                <h1>Sell on ARU Marketplace</h1>

            </div>

            <div class="header-spacer"></div>

        </div>

    </header>


    <!-- ========================================
         MAIN
    ========================================= -->

    <main class="sell-container">


        <!-- INTRO -->

        <section class="sell-intro">

            <p class="section-label">
                Start Selling
            </p>

            <h2>
                Create your listings
            </h2>

            <p>
                Add one or more products. Each product
                can have multiple photos and its own
                description.
            </p>

        </section>


        <!-- SELLER NOTICE -->

        <section class="seller-notice">

            <div class="seller-notice-icon">

                <i class="bi bi-shield-check"></i>

            </div>

            <div>

                <h3>
                    Safe marketplace
                </h3>

                <p>
                    Every product will be reviewed before
                    it becomes visible to buyers.
                </p>

            </div>

        </section>


        <!-- ========================================
             PRODUCTS CONTAINER
        ========================================= -->

        <section id="products-list">


            <!-- PRODUCT 1 WILL BE INSERTED HERE -->


        </section>


        <!-- ========================================
             ADD PRODUCT
        ========================================= -->

        <button
            type="button"
            id="add-product-button"
            class="add-product-button"
        >

            <i class="bi bi-plus-circle"></i>

            Add Another Product

        </button>


        <!-- ========================================
             SUBMIT ALL
        ========================================= -->

        <button
            type="button"
            id="submit-all-products"
            class="submit-all-products"
        >

            <i class="bi bi-cloud-arrow-up"></i>

            Submit All Products

        </button>


        <p
            id="sell-message"
            class="sell-message"
        ></p>


    </main>


    <!-- ========================================
         BOTTOM NAVIGATION
    ========================================= -->

    <nav class="bottom-navigation">


        <a
            href="/home.html"
            class="nav-item"
        >

            <i class="bi bi-house"></i>

            <span>Home</span>

        </a>


        <a
            href="#"
            class="nav-item"
            id="orders-link"
        >

            <i class="bi bi-box-seam"></i>

            <span>Orders</span>

        </a>


        <a
            href="/sell.html"
            class="nav-item active"
            id="sell-link"
        >

            <i class="bi bi-plus-circle-fill"></i>

            <span>Sell</span>

        </a>


        <a
            href="#"
            class="nav-item"
            id="profile-link"
        >

            <i class="bi bi-person-circle"></i>

            <span>Profile</span>

        </a>


    </nav>


    <script
        type="module"
        src="/src/sell.js"
    ></script>

</body>

</html>
