<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | ARU Marketplace</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="/src/style.css">
</head>

<body>

    <!-- Page Header -->
    <header class="page-header">
        <a href="/home.html" class="back-link" aria-label="Back to Home">
            <i class="bi bi-arrow-left"></i>
        </a>

        <div>
            <h1>My Profile</h1>
            <p>ARU Marketplace</p>
        </div>
    </header>

    <!-- Profile Content -->
    <main class="profile-page">

        <section class="profile-card">

            <!-- Profile Avatar and Account Name -->
            <div class="text-center mb-3">

                <div class="profile-avatar">
                    <i class="bi bi-person-circle"></i>
                </div>

                <h2 class="profile-heading" id="profile-name">
                    Loading profile...
                </h2>

                <span class="profile-role" id="profile-role">
                    Loading...
                </span>

            </div>

            <!-- Account Details -->
            <div class="profile-details">

                <div class="profile-detail">
                    <strong>Full Name</strong>
                    <span id="full-name">Loading...</span>
                </div>

                <div class="profile-detail">
                    <strong>Email Address</strong>
                    <span id="email-address">Loading...</span>
                </div>

                <div class="profile-detail">
                    <strong>WhatsApp Number</strong>
                    <span id="whatsapp-number">Loading...</span>
                </div>

                <div class="profile-detail">
                    <strong>Seller Status</strong>
                    <span id="seller-status">Loading...</span>
                </div>

            </div>

            <!-- Status and Error Messages -->
            <p
                id="profile-message"
                class="text-danger small mt-3"
                role="status"
                aria-live="polite"
            ></p>

            <!-- Logout -->
            <button
                id="logout-button"
                class="btn btn-dark w-100 profile-logout"
                type="button"
            >
                <i class="bi bi-box-arrow-right me-2"></i>
                Log Out
            </button>

        </section>

    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" aria-label="Main navigation">

        <a href="/home.html" class="bottom-nav-item">
            <i class="bi bi-house"></i>
            <span>Home</span>
        </a>

        <a href="/orders.html" class="bottom-nav-item">
            <i class="bi bi-receipt"></i>
            <span>Orders</span>
        </a>

        <a href="/sell.html" class="bottom-nav-item">
            <i class="bi bi-plus-circle"></i>
            <span>Sell</span>
        </a>

        <a
            href="/my-products.html"
            class="bottom-nav-item active"
            aria-current="page"
        >
            <i class="bi bi-person"></i>
            <span>Profile</span>
        </a>
        

    </nav>

    <!-- Firebase Profile Logic -->
    <script type="module" src="/src/profile.js"></script>

</body>
</html>
