{% extends 'base.html' %}

{% block title %}Enter Reset Code | Student Market Place{% endblock %}

{% block content %}{% include 'includes/breadcrumb.html' %}<section class="auth-section">
    <div class="container auth-card">
        <h1>Enter the reset code</h1>
        <p class="auth-note">We sent a verification code to <strong>{{ email }}</strong>.</p>

        <form method="post" class="auth-stack">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Verify code</button>
        </form>
    </div>
</section>
{% endblock %}
