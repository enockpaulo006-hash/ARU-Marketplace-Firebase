{% extends 'base.html' %}

{% block title %}Reset Password | Student Market Place{% endblock %}

{% block content %}{% include 'includes/breadcrumb.html' %}<section class="auth-section">
    <div class="container auth-card">
        <h1>Reset your password</h1>
        <p class="auth-note">Enter your email address and we will send a verification code.</p>

        <form method="post" class="auth-stack">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Send reset code</button>
        </form>
    </div>
</section>
{% endblock %}
