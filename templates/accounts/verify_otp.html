{% extends 'base.html' %}

{% block title %}Verify OTP | Student Market Place{% endblock %}

{% block content %}
{% include 'includes/breadcrumb.html' %}
<section class="auth-section">
    <div class="container auth-card">
        <h1>Verify OTP</h1>
        <p>Please enter the one-time code sent to your email to complete login.</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Verify Code</button>
        </form>
        <p class="auth-helper">
            <a href="{% url 'accounts:resend_otp' %}">Resend code</a>
        </p>
    </div>
</section>
{% endblock %}
