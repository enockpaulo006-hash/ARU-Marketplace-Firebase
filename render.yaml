databases:
  - name: student-marketplace-db
    plan: free
    databaseName: student_marketplace
    user: student_marketplace

services:
  - type: web
    name: student-marketplace
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: student-marketplace-db
          property: connectionString
      - key: DB_CONN_MAX_AGE
        value: "600"
      - key: PRODUCTS_PER_PAGE
        value: "12"
      - key: PRODUCT_IMAGE_MAX_WIDTH
        value: "1200"
      - key: PRODUCT_IMAGE_MAX_HEIGHT
        value: "1200"
      - key: PRODUCT_IMAGE_QUALITY
        value: "82"
      - key: SELLER_OTP_ENABLED
        value: 'False'
      - key: CLOUDINARY_URL
        sync: false
      - key: EMAIL_BACKEND
        value: accounts.email_backends.ResendEmailBackend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: ARUMarket <onboarding@resend.dev>
      - key: EMAIL_TIMEOUT
        value: "5"
